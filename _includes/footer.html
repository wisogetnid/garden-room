<footer class="site-footer h-card" style="padding: 20px 0; border-top: 1px solid #e8e8e8; color: #828282; font-size: 14px;">
  <div class="wrapper" style="display: flex; justify-content: space-between; align-items: center;">
    
    <!-- Left: Author -->
    <div style="flex: 1; text-align: left;">
      {{ site.author | escape }}
    </div>

    <!-- Center: Description -->
    <div style="flex: 2; text-align: center;">
      {{ site.description | escape }}
    </div>

    <!-- Right: Version Tag -->
    <div style="flex: 1; text-align: right; font-family: monospace;">
      {% if site.github.build_revision %}
        <a href="{{ site.github.repository_url }}/commit/{{ site.github.build_revision }}" target="_blank" style="color: inherit; text-decoration: none;">
          {{ site.github.build_revision | slice: 0, 7 }}
        </a>
      {% else %}
        local-dev
      {% endif %}
    </div>

  </div>
</footer>
