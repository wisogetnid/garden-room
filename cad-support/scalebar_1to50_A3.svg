<svg xmlns="http://www.w3.org/2000/svg" width="110mm" height="15mm" viewBox="0 0 110 15">
  <g font-family="Arial, sans-serif" font-size="3.5" text-anchor="middle" fill="#000000">
    <!-- Scale Bar Segments (20mm per 1m = 1:50 Scale) -->
    <rect x="5" y="6" width="20" height="3" fill="#000000" stroke="#000000" stroke-width="0.3"/>
    <rect x="25" y="6" width="20" height="3" fill="#FFFFFF" stroke="#000000" stroke-width="0.3"/>
    <rect x="45" y="6" width="20" height="3" fill="#000000" stroke="#000000" stroke-width="0.3"/>
    <rect x="65" y="6" width="20" height="3" fill="#FFFFFF" stroke="#000000" stroke-width="0.3"/>
    <rect x="85" y="6" width="20" height="3" fill="#000000" stroke="#000000" stroke-width="0.3"/>

    <!-- Tick Numbers -->
    <text x="5" y="4.5">0m</text>
    <text x="25" y="4.5">1m</text>
    <text x="45" y="4.5">2m</text>
    <text x="65" y="4.5">3m</text>
    <text x="85" y="4.5">4m</text>
    <text x="105" y="4.5">5m</text>

    <!-- Scale Label -->
    <text x="55" y="13" font-size="3" font-weight="bold">SCALE 1:50 @ A3</text>
  </g>
</svg>
